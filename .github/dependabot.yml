version: 2
updates:
  # Single root lockfile covers every workspace (packages/*, apps/*).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # One PR for routine minor/patch bumps so the weekly cycle is a single
      # review; security and major bumps still arrive individually.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
